<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjim - PDF Translator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tarjim PDF Translator</h1>
            <p>Upload an Arabic PDF to translate it into your chosen language.</p>
        </header>
        <main>
            <form id="translate-form">
                <div class="file-input-wrapper">
                    <input type="file" id="pdf-file" name="file" accept=".pdf" required>
                    <label for="pdf-file" id="file-label">Click to select a PDF file</label>
                </div>

                <div class="options-row">
                    <div class="language-selector">
                        <label for="target-lang">Translate to:</label>
                        <select id="target-lang" name="target_lang">
                            <option value="en" selected>English</option>
                            <option value="id">Indonesian (Bahasa)</option>
                            <option value="ms">Malay</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="es">Spanish</option>
                            <option value="tr">Turkish</option>
                            <option value="ur">Urdu</option>
                        </select>
                    </div>

                    <div class="language-selector">
                        <label for="overlay-mode">Overlay:</label>
                        <select id="overlay-mode" name="overlay_mode">
                            <option value="replace" selected>Replace text</option>
                            <option value="clean">Clean (white bg)</option>
                        </select>
                    </div>
                </div>

                <div class="options-row">
                    <div class="language-selector">
                        <label for="translator">Translator:</label>
                        <select id="translator" name="translator">
                            <option value="nllb" selected>NLLB-200 (high quality)</option>
                            <option value="argos">Argos (lightweight)</option>
                        </select>
                    </div>
                </div>

                <div class="options-row tashkeel-row">
                    <div class="tashkeel-group">
                        <span class="tashkeel-label">Tashkeel (حركات):</span>
                        <label class="checkbox-label" id="tashkeel-only-label" title="Diacritize Arabic text with CATT and overlay it back — no translation at all. Produces a fully-vowelized Arabic PDF.">
                            <input type="checkbox" id="tashkeel-only" name="tashkeel_only">
                            Overlay only
                            <span class="hint">(no translation)</span>
                        </label>
                        <label class="checkbox-label" id="tashkeel-label" title="Diacritize Arabic text before translation using CATT. Improves translation accuracy for undiacritized kitab text.">
                            <input type="checkbox" id="tashkeel" name="tashkeel">
                            Enable
                            <span class="hint">(better translation accuracy)</span>
                        </label>
                        <label class="checkbox-label" id="show-tashkeel-label" title="Show diacritized Arabic text in the output PDF, stacked above the translation.">
                            <input type="checkbox" id="show-tashkeel" name="show_tashkeel" disabled>
                            Show in PDF
                            <span class="hint">(bilingual output)</span>
                        </label>
                    </div>
                </div>

                <div id="route-info" class="route-info"></div>

                <button type="submit" id="submit-btn">Translate</button>
            </form>
            <div id="status"></div>
        </main>
        <footer>
            <p>Powered by Surya OCR + CATT Tashkeel + NLLB-200 (fully offline)</p>
        </footer>
    </div>

    <script>
        const form = document.getElementById('translate-form');
        const fileInput = document.getElementById('pdf-file');
        const fileLabel = document.getElementById('file-label');
        const submitBtn = document.getElementById('submit-btn');
        const statusDiv = document.getElementById('status');
        const langSelect = document.getElementById('target-lang');
        const overlaySelect = document.getElementById('overlay-mode');
        const routeInfo = document.getElementById('route-info');
        const translatorSelect = document.getElementById('translator');
        const tashkeelCheckbox = document.getElementById('tashkeel');
        const tashkeelLabel = document.getElementById('tashkeel-label');
        const showTashkeelCheckbox = document.getElementById('show-tashkeel');
        const showTashkeelLabel = document.getElementById('show-tashkeel-label');
        const tashkeelOnlyCheckbox = document.getElementById('tashkeel-only');

        // Route descriptions per translator
        const routeDescriptions = {
            nllb: {
                'en': 'Direct: Arabic \u2192 English (NLLB-200)',
                'id': 'Direct: Arabic \u2192 Indonesian (NLLB-200, no pivot)',
                'ms': 'Direct: Arabic \u2192 Malay (NLLB-200)',
                'fr': 'Direct: Arabic \u2192 French (NLLB-200)',
                'de': 'Direct: Arabic \u2192 German (NLLB-200)',
                'es': 'Direct: Arabic \u2192 Spanish (NLLB-200)',
                'tr': 'Direct: Arabic \u2192 Turkish (NLLB-200)',
                'ur': 'Direct: Arabic \u2192 Urdu (NLLB-200)',
            },
            argos: {
                'en': 'Direct: Arabic \u2192 English (Argos)',
                'id': 'Pivot: Arabic \u2192 English \u2192 Indonesian (Argos)',
                'ms': 'Pivot: Arabic \u2192 English \u2192 Malay (Argos)',
                'fr': 'Pivot: Arabic \u2192 English \u2192 French (Argos)',
                'de': 'Pivot: Arabic \u2192 English \u2192 German (Argos)',
                'es': 'Pivot: Arabic \u2192 English \u2192 Spanish (Argos)',
                'tr': 'Pivot: Arabic \u2192 English \u2192 Turkish (Argos)',
                'ur': 'Pivot: Arabic \u2192 English \u2192 Urdu (Argos)',
            },
        };

        function updateRouteInfo() {
            if (tashkeelOnlyCheckbox.checked) {
                routeInfo.textContent = 'Tashkeel only: diacritize Arabic text \u2192 overlay back (no translation)';
                routeInfo.style.display = 'block';
                return;
            }
            const lang = langSelect.value;
            const tr = translatorSelect.value;
            const desc = (routeDescriptions[tr] || {})[lang] || `Arabic \u2192 ${lang}`;
            routeInfo.textContent = desc;
            routeInfo.style.display = 'block';
        }

        langSelect.addEventListener('change', updateRouteInfo);
        translatorSelect.addEventListener('change', updateRouteInfo);
        tashkeelOnlyCheckbox.addEventListener('change', updateRouteInfo);
        updateRouteInfo();

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = fileInput.files[0].name;
                fileLabel.classList.add('file-selected');
            } else {
                fileLabel.textContent = 'Click to select a PDF file';
                fileLabel.classList.remove('file-selected');
            }
        });

        // Tashkeel-only: disable translator, language, and show-in-PDF controls
        tashkeelOnlyCheckbox.addEventListener('change', () => {
            const tashkeelOnly = tashkeelOnlyCheckbox.checked;

            // Translator selector
            translatorSelect.disabled = tashkeelOnly;
            translatorSelect.closest('.language-selector').style.opacity = tashkeelOnly ? '0.4' : '1';
            translatorSelect.closest('.language-selector').style.pointerEvents = tashkeelOnly ? 'none' : 'auto';

            // Language selector
            langSelect.disabled = tashkeelOnly;
            langSelect.closest('.language-selector').style.opacity = tashkeelOnly ? '0.4' : '1';
            langSelect.closest('.language-selector').style.pointerEvents = tashkeelOnly ? 'none' : 'auto';

            // "Enable tashkeel" and "Show in PDF" checkboxes
            if (tashkeelOnly) {
                tashkeelCheckbox.checked = true;
                tashkeelCheckbox.disabled = true;
                tashkeelLabel.style.opacity = '0.4';
                tashkeelLabel.style.pointerEvents = 'none';
                showTashkeelCheckbox.checked = false;
                showTashkeelCheckbox.disabled = true;
                showTashkeelLabel.style.opacity = '0.4';
                showTashkeelLabel.style.pointerEvents = 'none';
            } else {
                tashkeelCheckbox.disabled = false;
                tashkeelLabel.style.opacity = '1';
                tashkeelLabel.style.pointerEvents = 'auto';
                // Restore show-in-PDF state based on tashkeel checkbox
                const tashkeelEnabled = tashkeelCheckbox.checked;
                showTashkeelCheckbox.disabled = !tashkeelEnabled;
                showTashkeelLabel.style.opacity = tashkeelEnabled ? '1' : '0.4';
                showTashkeelLabel.style.pointerEvents = tashkeelEnabled ? 'auto' : 'none';
            }

            updateRouteInfo();
        });

        // Enable/disable "Show in PDF" based on "Enable Tashkeel" state
        tashkeelCheckbox.addEventListener('change', () => {
            const enabled = tashkeelCheckbox.checked;
            showTashkeelCheckbox.disabled = !enabled;
            showTashkeelLabel.style.opacity = enabled ? '1' : '0.4';
            showTashkeelLabel.style.pointerEvents = enabled ? 'auto' : 'none';
            if (!enabled) {
                showTashkeelCheckbox.checked = false;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileInput.files[0]) {
                statusDiv.textContent = 'Please select a file first.';
                statusDiv.className = 'error';
                return;
            }

            const selectedLang = langSelect.value;
            const selectedOverlay = overlaySelect.value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Translating...';

            const isTashkeelOnly = tashkeelOnlyCheckbox.checked;
            const langName = langSelect.options[langSelect.selectedIndex].text;
            if (isTashkeelOnly) {
                statusDiv.textContent = 'Diacritizing Arabic text (Tashkeel-only)... This may take a few minutes per page.';
            } else {
                const tashkeelNote = tashkeelCheckbox.checked ? ' (with Tashkeel — may take a bit longer)' : '';
                statusDiv.textContent = `Translating to ${langName}${tashkeelNote}... This may take a few minutes per page.`;
            }
            statusDiv.className = 'info';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('target_lang', selectedLang);
            formData.append('source_lang', 'ar');
            formData.append('overlay_mode', selectedOverlay);
            formData.append('translator', translatorSelect.value);
            formData.append('tashkeel', isTashkeelOnly || tashkeelCheckbox.checked);
            formData.append('show_tashkeel', showTashkeelCheckbox.checked);
            formData.append('tashkeel_only', isTashkeelOnly);

            try {
                const response = await fetch('/translate-pdf/', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! Status: ${response.status}`);
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = isTashkeelOnly
                    ? `tashkeel_${fileInput.files[0].name}`
                    : `translated_${selectedLang}_${fileInput.files[0].name}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);

                statusDiv.textContent = isTashkeelOnly
                    ? 'Tashkeel overlay successful! Your download has started.'
                    : `Translation to ${langName} successful! Your download has started.`;
                statusDiv.className = 'success';

            } catch (error) {
                console.error('Translation failed:', error);
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Translate';
            }
        });
    </script>
</body>
</html>
